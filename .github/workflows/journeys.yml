name: journeys
on:
  pull_request:
  workflow_dispatch:
    inputs:
      target:
        description: Where to run the journeys
        default: pull_request
jobs:
  journeys:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test journeys/
        env:
          BASE_URL: ${{ inputs.target == 'staging' && vars.STAGING_URL || '' }}
